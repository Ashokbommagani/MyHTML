<!DOCTYPE html>
<html>
    <head>
        <title>Basic Table</title>
    </head>
    <body>
        <table border="1">
            <caption>Sample Table</caption>
            <tr>
                <th>Name</th>
                <th>Age</th>
            </tr>
            <tr>
                <td>John</td>
                <td>25</td>
            </tr>
            <tr>
                <td>Jane</td>
                <td>30</td>
            </tr>
        </table>
    </body>
</html>
