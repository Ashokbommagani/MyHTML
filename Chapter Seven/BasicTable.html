<!DOCTYPE html>
<html>
    <head>
        <title>Basic Table</title>
    </head>
    <body>
        <table border="1">
            <caption><h1>Sample Table</h1></caption>
            <thead>
                <tr>
                    <th scope="col">Name</th>
                    <th scope="col">Age</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>John</td>
                    <td>25</td>
                </tr>
                <tr>
                    <td>Jane</td>
                    <td>30</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
