<!DOCTYPE html>
<html>
<head>
    <title>HTML Multimedia</title>
</head>

<body>

    <h1>HTML Multimedia Examples</h1>

    <!-- Audio -->
    <h2>Audio</h2>

    <audio controls loop muted autoplay>
        <source src="music.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>


    <!-- Video -->
    <h2>Video</h2>

    <video
        controls
        width="640"
        poster="thumbnail.jpg">

        <source src="movie.mp4" type="video/mp4">

        Your browser does not support video.
    </video>


    <!-- YouTube -->
    <h2>YouTube Video</h2>


<iframe width="560" height="200" src="https://www.youtube.com/embed/S_Ibf2Aztv8?si=aNH-o29zSPFVP2aI" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
