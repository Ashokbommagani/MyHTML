<!DOCTYPE html>
<html>
<head>
    <title>HTML Multimedia</title>
</head>

<body>

    <h1>HTML Multimedia Examples</h1>

    <!-- Audio -->
    <h2>Audio</h2>

    <audio controls>
        <source src="music.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>


    <!-- Video -->
    <h2>Video</h2>

    <video
        controls
        width="640"
        poster="thumbnail.jpg">

        <source src="movie.mp4" type="video/mp4">
        <source src="movie.webm" type="video/webm">

        Your browser does not support video.
    </video>


    <!-- YouTube -->
    <h2>YouTube Video</h2>

    <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/<iframe width="1199" height="618" src="https://www.youtube.com/embed/b8dvhBPrGt" title="Mirchi Telugu Full Movie | Prabhas, Anushka Shetty, Richa Gangopadhyay@SriBalajiMovies" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>"
        title="YouTube Video"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
    </iframe>

</body>
</html>
